# Configuração do bootc-image-builder para gerar mídia de teste.
#
# Deliberadamente SEM bloco [[customizations.user]]: a imagem do Arkmos não
# declara usuário nenhum, e a conta nasce no assistente do primeiro boot.
# Definir um usuário aqui pularia justamente o fluxo que precisa ser testado.
#
# Este arquivo descreve a MÍDIA, não a imagem — nada daqui vai parar no
# registry, então é o lugar certo caso um dia seja preciso injetar algo
# específico de uma instalação.

# 40 GiB porque a imagem instala os Flatpaks da lista no primeiro boot, alguns
# GB entre aplicativos e runtimes, e o disco ainda guarda duas ou três
# deployments para o rollback. O qcow2 é esparso: no host ele só ocupa o que
# foi escrito, não o tamanho declarado.
[[customizations.filesystem]]
mountpoint = "/"
minsize = "40 GiB"

# O builder acrescenta console=tty0 console=ttyS0 na linha de boot do qcow2. Com
# console serial o Plymouth alterna entre o splash e o modo texto de reserva, e
# o que aparece muda a cada boot. O plymouth.ignore-serial-consoles faz o
# Plymouth ignorar o serial e desenhar o splash na tela da VM, como numa máquina
# real. O console serial continua funcionando (View → serial0 na janela do QEMU).
#
# O systemd.wants=sshd.service liga o servidor SSH só nesta VM: a imagem o
# deixa desligado, e é por ele que o 'just run-vm' oferece ssh na porta 2222.
[customizations.kernel]
append = "plymouth.ignore-serial-consoles systemd.wants=sshd.service"
