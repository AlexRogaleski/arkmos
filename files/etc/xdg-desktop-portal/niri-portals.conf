# Backends de portal sob o Niri.
#
# Sem este arquivo o xdg-desktop-portal não sabe qual implementação usar: os
# backends declaram 'UseIn=gnome' e o Niri não é o GNOME.
#
# A interface Settings é declarada explicitamente, e não deixada para o
# 'default'. Com 'default=gnome;gtk;' ela ia para o backend do GNOME, que
# pressupõe componentes de uma sessão GNOME que aqui não existem. Quando essa
# interface não responde, aplicativos não descobrem que o sistema está no tema
# escuro — o Firefox e os aplicativos Electron abrem claros mesmo com o dconf
# configurado, porque é por aqui que eles perguntam.
#
# O backend gtk responde a Settings lendo do GSettings, que é exatamente onde
# o banco do dconf do Arkmos grava.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Settings=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
