# Arkmos — padrões do Noctalia para conta nova.
#
# O Noctalia só lê configuração do home (~/.config/noctalia), sem diretório de
# sistema, então o padrão chega pelo /etc/skel, que o useradd copia ao criar a
# conta. Vale só para conta nova, e a partir daí o arquivo é do usuário.
#
# O que se escolhe pela interface vai para ~/.local/state/noctalia/settings.toml,
# que carrega por último e vence este arquivo: trocar o wallpaper ou o esquema
# de cores pela interface não exige editar nada aqui.
#
# Barra, dock e painéis vieram de uma sessão de testes na VM, exportada com
# 'noctalia config export'. O que é específico de máquina ficou de fora:
# wallpaper pessoal, último wallpaper usado e posição de widget da tela de
# bloqueio, que grava o nome do monitor e as coordenadas dele.

# Idioma da interface do Noctalia. O LANG da sessão já é pt_BR, mas o shell tem
# a própria configuração de idioma.
#
# O corner_radius_scale multiplica o arredondamento de toda a interface do
# shell — barra, painéis, tela de bloqueio. Escolhido em 1.25, na VM, para
# acompanhar os cantos das janelas. Ele é uma das coisas que o sync leva ao
# greeter, e é por isso que NÃO é declarado no greeter.toml: valor lá venceria
# o sync e congelaria o login neste número.
#
# font_family é a fonte da interface inteira: Adwaita Sans, a mesma do dconf e
# dos settings.ini, para barra e janelas não usarem fontes diferentes. O padrão
# do Noctalia é 'sans-serif', que no Fedora cai na Noto Sans.
[shell]
lang = "pt-BR"
corner_radius_scale = 1.25
font_family = "Adwaita Sans"

# Esquema de cores do sistema: Tokyo Night, embutido no Noctalia. É dele que
# saem as cores do shell, e o sync as leva para a tela de login. O identificador
# é "Tokyo-Night", como no código do Noctalia — o validador não confere nomes de
# esquema, um nome errado só cairia no padrão em silêncio.
#
# Diferente dos blocos de inatividade, blocos normais como este MESCLAM com o
# padrão do Noctalia: o que não está declarado aqui continua com o valor dele.
#
# wallpaper_scheme só tem efeito quando a paleta é gerada a partir do papel de
# parede, o que não é o padrão daqui; fica declarado para essa escolha já vir
# pronta.
[theme]
source = "builtin"
builtin = "Tokyo-Night"
mode = "dark"
wallpaper_scheme = "m3-tonal-spot"

# Programas que passam a seguir a paleta do Noctalia. A cada troca de esquema
# ele reescreve o arquivo de cores de cada um e avisa o programa:
#
#   gtk3, gtk4     ~/.config/gtk-{3.0,4.0}/noctalia.css, importado no gtk.css
#   btop           ~/.config/btop/themes/noctalia.theme, no btop.conf
#   kcolorscheme   ~/.local/share/color-schemes/noctalia.colors, apontado no
#                  kdeglobals — é por ele que aplicativo Qt/KDE lê cor de
#                  sistema, inclusive em Flatpak (o Fedora Media Writer, da
#                  nossa lista, pede justamente o kdeglobals da conta)
#
# Só entram os que escrevem em arquivo que o Arkmos não entrega. Os templates
# de foot e de niri ficam de fora de propósito: os dois criam configuração na
# conta do usuário, e esses programas leem a do usuário EM VEZ da do sistema —
# o de niri apagaria na prática todos os atalhos e o prefer-no-csd desta
# imagem. O terminal já é Tokyo Night pelo tema do próprio foot, e o anel de
# foco do niri usa as cores do esquema, fixos (seção 26.1 do PROJECT.md).
[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "btop", "kcolorscheme" ]

# A pasta que a lista de papéis de parede do Noctalia mostra. O painel entra nas
# subpastas, então aqui vão todos: os do Arkmos em arkmos/ — gerados por IA
# pelo autor do projeto, mais o arkmos.webp que o build_files/render-artwork.sh
# desenha com o nome do sistema —, o da versão do Fedora em f44/ e o conjunto
# complementar dele em fedora-workstation/.
[wallpaper]
directory = "/usr/share/backgrounds"

# O papel de parede que a conta nova recebe. A tela de bloqueio usa o do
# desktop enquanto [lockscreen] wallpaper estiver vazio, que é o padrão — por
# isso não é declarado.
[wallpaper.default]
path = "/usr/share/backgrounds/arkmos/arkmos-default.webp"

# Barra: o que fica em cada terço dela. A fonte não é declarada de propósito —
# herda o font_family do [shell]. Os dois espaçadores são declarados logo abaixo: sem a
# declaração, o nome na lista não corresponde a widget nenhum e o espaço não
# aparece.
[bar.default]
start = [ "launcher", "screenshot", "wallpaper", "spacer_2", "workspaces", "spacer_4", "active_window" ]
center = [ "clock", "media" ]
end = [
    "sysmon",
    "ram",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "caffeine",
    "session"
]
background_opacity = 0.6
margin_ends = 0
radius = 0

[widget.spacer_2]
type = "spacer"

[widget.spacer_4]
type = "spacer"

# Dock com ocultação automática e sem reservar espaço: a janela ocupa a tela
# inteira e o dock aparece ao aproximar o ponteiro.
#
# Os fixados são ids de .desktop. O do VS Code é da imagem; os outros quatro
# são Flatpaks da lista de preinstall — um id que não esteja instalado viraria
# ícone morto no dock, e é por isso que o Thunderbird aqui é o
# 'org.mozilla.Thunderbird' da lista, e não a variante ESR.
#
# O VS Code entra como 'com.microsoft.VSCode': o pacote da Microsoft renomeou
# a entrada na 1.139.0 (2026-09), e 'code' deixou de existir. Aqui não cabe
# listar os dois ids como no mimeapps.list — cada item é um ícone, e o antigo
# apareceria morto ao lado do novo.
[dock]
enabled = true
auto_hide = true
reserve_space = false
launcher_position = "start"
background_opacity = 0.6
pinned = [ "com.microsoft.VSCode", "com.spotify.Client", "com.anydesk.Anydesk", "io.github.kolunmi.Bazaar", "org.mozilla.Thunderbird" ]

# Lançador ancorado no canto superior esquerdo, abrindo perto de onde foi
# clicado.
[shell.panel]
launcher_placement = "attached"
launcher_position = "top_left"
open_near_click_launcher = true

# O widget de clima precisa saber onde a máquina está. A localização é por IP,
# sem GPS.
[location]
auto_locate = true

# Notificações. O Noctalia é o daemon do sistema (enable_daemon, ligado por
# padrão), e por isso a imagem não instala mako.
#
# Dois padrões dele são "sem limite", e é o que muda aqui:
#
#   max_visible = 0               enche a tela de toasts numa rajada
#   history_retention_hours = 0   guarda o histórico para sempre
#
# O resto fica como vem: canto superior direito, que acompanha a barra; camada
# 'top', que mantém o toast fora de aplicativo em tela cheia; borda, opacidade
# e margens.
[notification]
max_visible = 4
history_retention_hours = 168

# O Spotify notifica a cada troca de música, e a barra já tem o widget de mídia
# mostrando o que toca. O toast sai; o histórico também, porque seria uma
# entrada por faixa.
[notification.filter.spotify]
enabled = true
match = "spotify"
show_toast = false
save_history = false

# Leva wallpaper, paleta e fonte para a tela de login sempre que a aparência
# muda. Não pede senha: a regra em
# /usr/share/polkit-1/rules.d/50-arkmos-greeter-sync.rules libera essa ação
# para o grupo wheel.
[shell.greeter_sync]
auto_sync = true

# O Noctalia vem com toda ação por inatividade desligada: a tela nunca
# bloqueia nem apaga sozinha. Aqui ligam o bloqueio e a tela apagada, com os
# tempos do próprio Noctalia (10 e 11 minutos). A suspensão fica desligada, para
# não interromper um build ou um download longo; fechar a tampa já bloqueia
# antes de suspender (lock_before_suspend, ligado por padrão).
# Cada bloco declara a ação e o tempo inteiros de propósito: o Noctalia
# SUBSTITUI o bloco, não mescla com o padrão dele. Declarar só 'enabled = true'
# deixava a ação vazia e o tempo em zero, que é o mesmo que desligado — e sem
# erro nenhum. Os valores abaixo são os padrões do próprio Noctalia.
[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 600.0

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 660.0

# Declarada desligada para continuar aparecendo nas configurações do Noctalia,
# junto das outras duas.
[idle.behavior.lock-and-suspend]
enabled = false
action = "lock_and_suspend"
timeout = 900.0

# Capturas na mesma pasta das do niri (screenshot-path em /etc/niri/config.kdl).
# Sem isto o Noctalia salva direto em ~/Imagens, e as capturas ficariam
# divididas entre duas pastas conforme a tecla usada.
[shell.screenshot]
directory = "~/Imagens/Capturas de tela"
