# Arkmos — padrões do Noctalia para conta nova.
#
# O Noctalia só lê configuração do home (~/.config/noctalia), sem diretório de
# sistema, então o padrão chega pelo /etc/skel, que o useradd copia ao criar a
# conta. Vale só para conta nova, e a partir daí o arquivo é do usuário.
#
# O que se escolhe pela interface vai para ~/.local/state/noctalia/settings.toml,
# que carrega por último e vence este arquivo: trocar o wallpaper ou o esquema
# de cores pela interface não exige editar nada aqui.

# Esquema de cores do sistema: Tokyo Night, embutido no Noctalia. É dele que
# saem as cores do shell, e o sync as leva para a tela de login. O identificador
# é "Tokyo-Night", como no código do Noctalia — o validador não confere nomes de
# esquema, um nome errado só cairia no padrão em silêncio.
#
# Diferente dos blocos de inatividade, blocos normais como este MESCLAM com o
# padrão do Noctalia: o que não está declarado aqui continua com o valor dele.
[theme]
source = "builtin"
builtin = "Tokyo-Night"
mode = "dark"

# Programas que passam a seguir a paleta do Noctalia. A cada troca de esquema
# ele reescreve o arquivo de cores de cada um e avisa o programa:
#
#   gtk3, gtk4     ~/.config/gtk-{3.0,4.0}/noctalia.css, importado no gtk.css
#   btop           ~/.config/btop/themes/noctalia.theme, no btop.conf
#   kcolorscheme   ~/.local/share/color-schemes/noctalia.colors, apontado no
#                  kdeglobals — é por ele que aplicativo Qt/KDE lê cor de
#                  sistema, inclusive em Flatpak (o Fedora Media Writer, da
#                  nossa lista, pede justamente o kdeglobals da conta)
#
# Só entram os que escrevem em arquivo que o Arkmos não entrega. Os templates
# de foot e de niri ficam de fora de propósito: os dois criam configuração na
# conta do usuário, e esses programas leem a do usuário EM VEZ da do sistema —
# o de niri apagaria na prática todos os atalhos e o prefer-no-csd desta
# imagem. O terminal já é Tokyo Night pelo tema do próprio foot, e o anel de
# foco do niri usa o roxo do esquema, fixos (seção 26.1 do PROJECT.md).
[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "btop", "kcolorscheme" ]

# A pasta que a lista de papéis de parede do Noctalia mostra. São os do próprio
# Arkmos, gerados por IA pelo autor do projeto, mais o arkmos.webp que o
# build_files/render-artwork.sh desenha com o nome do sistema.
[wallpaper]
directory = "/usr/share/backgrounds/arkmos"

# O papel de parede que a conta nova recebe. A tela de bloqueio usa o do
# desktop enquanto [lockscreen] wallpaper estiver vazio, que é o padrão — por
# isso não é declarado.
[wallpaper.default]
path = "/usr/share/backgrounds/arkmos/arkmos-default.webp"

# Leva wallpaper, paleta e fonte para a tela de login sempre que a aparência
# muda. Não pede senha: a regra em
# /usr/share/polkit-1/rules.d/50-arkmos-greeter-sync.rules libera essa ação
# para o grupo wheel.
[shell.greeter_sync]
auto_sync = true

# O Noctalia vem com toda ação por inatividade desligada: a tela nunca
# bloqueia nem apaga sozinha. Aqui ligam o bloqueio e a tela apagada, com os
# tempos do próprio Noctalia (10 e 11 minutos). A suspensão fica desligada, para
# não interromper um build ou um download longo; fechar a tampa já bloqueia
# antes de suspender (lock_before_suspend, ligado por padrão).
# Cada bloco declara a ação e o tempo inteiros de propósito: o Noctalia
# SUBSTITUI o bloco, não mescla com o padrão dele. Declarar só 'enabled = true'
# deixava a ação vazia e o tempo em zero, que é o mesmo que desligado — e sem
# erro nenhum. Os valores abaixo são os padrões do próprio Noctalia.
[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 600.0

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 660.0

# Declarada desligada para continuar aparecendo nas configurações do Noctalia,
# junto das outras duas.
[idle.behavior.lock-and-suspend]
enabled = false
action = "lock_and_suspend"
timeout = 900.0

# Capturas na mesma pasta das do niri (screenshot-path em /etc/niri/config.kdl).
# Sem isto o Noctalia salva direto em ~/Imagens, e as capturas ficariam
# divididas entre duas pastas conforme a tecla usada.
[shell.screenshot]
directory = "~/Imagens/Capturas de tela"
