# Arkmos — padrões do Noctalia para conta nova.
#
# O Noctalia só lê configuração do home (~/.config/noctalia), sem diretório de
# sistema, então o padrão chega pelo /etc/skel, que o useradd copia ao criar a
# conta. Vale só para conta nova, e a partir daí o arquivo é do usuário.
#
# O que se escolhe pela interface vai para ~/.local/state/noctalia/settings.toml,
# que carrega por último e vence este arquivo: trocar o wallpaper ou o esquema
# de cores pela interface não exige editar nada aqui.

# Gerado no build por build_files/render-artwork.sh. A tela de bloqueio usa o
# wallpaper do desktop enquanto [lockscreen] wallpaper estiver vazio, que é o
# padrão — por isso não é declarado.
[wallpaper.default]
path = "/usr/share/backgrounds/arkmos/arkmos.webp"

# Leva wallpaper, paleta e fonte para a tela de login sempre que a aparência
# muda. Não pede senha: a regra em
# /usr/share/polkit-1/rules.d/50-arkmos-greeter-sync.rules libera essa ação
# para o grupo wheel.
[shell.greeter_sync]
auto_sync = true

# O Noctalia vem com toda ação por inatividade desligada: a tela nunca
# bloqueia nem apaga sozinha. Aqui ligam o bloqueio e a tela apagada, com os
# tempos do próprio Noctalia (10 e 11 minutos). A suspensão fica desligada, para
# não interromper um build ou um download longo; fechar a tampa já bloqueia
# antes de suspender (lock_before_suspend, ligado por padrão).
# Cada bloco declara a ação e o tempo inteiros de propósito: o Noctalia
# SUBSTITUI o bloco, não mescla com o padrão dele. Declarar só 'enabled = true'
# deixava a ação vazia e o tempo em zero, que é o mesmo que desligado — e sem
# erro nenhum. Os valores abaixo são os padrões do próprio Noctalia.
[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 600.0

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 660.0

# Declarada desligada para continuar aparecendo nas configurações do Noctalia,
# junto das outras duas.
[idle.behavior.lock-and-suspend]
enabled = false
action = "lock_and_suspend"
timeout = 900.0

# Capturas na mesma pasta das do niri (screenshot-path em /etc/niri/config.kdl).
# Sem isto o Noctalia salva direto em ~/Imagens, e as capturas ficariam
# divididas entre duas pastas conforme a tecla usada.
[shell.screenshot]
directory = "~/Imagens/Capturas de tela"
