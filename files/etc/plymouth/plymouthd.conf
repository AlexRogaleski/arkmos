# Arkmos — splash de boot.
#
# O padrão do Fedora é o tema bgrt, que desenha o logo gravado no firmware: numa
# máquina Lenovo o sistema se apresenta como "Lenovo". O tema do Arkmos fica em
# /usr/share/plymouth/themes/arkmos, com a arte gerada no build.
#
# O plymouthd arranca de dentro do initramfs e continua rodando depois do
# switch-root com o tema que carregou lá. Mudar o tema aqui sem regerar o
# initramfs não tem efeito nenhum no boot — por isso o Containerfile roda o
# dracut depois de copiar este arquivo.
[Daemon]
Theme=arkmos
