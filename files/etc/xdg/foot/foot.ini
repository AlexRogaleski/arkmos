# Arkmos — terminal.
#
# Configuração de sistema. Um ~/.config/foot/foot.ini do usuário substitui
# este arquivo por inteiro — o foot não mescla os dois.
#
# A paleta é provisória: vem de um tema que o próprio pacote foot entrega, e
# será substituída na definição da identidade visual (PROJECT.md, seção 26).
# Trocar é uma linha; 'ls /usr/share/foot/themes' lista as opções.

[main]
font=JetBrainsMono Nerd Font:size=11
pad=8x8
include=/usr/share/foot/themes/tokyonight-night

# O tema acima preenche [colors-dark]. Explícito aqui porque depender do
# default do foot deixaria a aparência à mercê de uma mudança upstream.
initial-color-theme=dark

[csd]
# Com prefer-no-csd no niri, quem desenha a decoração é o compositor e esta
# seção não entra em jogo. Ela é a rede de segurança para o caso de o
# compositor pedir CSD: sem 'preferred=none', o foot desenha uma barra de
# título usando a cor de foreground padrão — branca, independente do esquema
# de cores configurado, que foi o que apareceu no primeiro teste em VM.
preferred=none
size=0

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes
