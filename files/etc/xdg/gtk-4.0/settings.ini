# Aparência padrão para aplicativos GTK4.
#
# Alcance menor que o do GTK3: aplicativos libadwaita ignoram tema GTK e
# escolhem claro ou escuro pelo color-scheme, que chega pelo portal de
# Settings (ou pelo GSettings, que o banco do dconf define). O que este
# arquivo resolve de fato é cursor e tipografia, que não passam por lá.
#
# 'gtk-application-prefer-dark-theme' não vale mais no GTK4 — por isso não
# está aqui.

[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-decoration-layout=appmenu:close
