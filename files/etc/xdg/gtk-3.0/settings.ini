# Aparência padrão para aplicativos GTK3.
#
# Isto é redundante com o banco do dconf de propósito, e a redundância tem
# motivo: são caminhos de leitura diferentes.
#
# O GTK3 em Wayland descobre o tema consultando o portal de Settings, que por
# sua vez lê do GSettings. Se o portal não estiver de pé — ou se o backend
# escolhido para a interface Settings não responder — o GTK3 não cai no
# GSettings: ele usa o default embutido, que é o Adwaita claro. O resultado é
# um Firefox branco num desktop escuro, com o dconf configurado corretamente.
#
# Este arquivo é lido direto pela biblioteca, sem D-Bus e sem portal, a partir
# de XDG_CONFIG_DIRS (/etc/xdg). Um ~/.config/gtk-3.0/settings.ini do usuário
# tem precedência sobre ele.

[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-application-prefer-dark-theme=1
gtk-decoration-layout=appmenu:close
