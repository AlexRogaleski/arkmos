# Grupo docker declarado na imagem, em /usr.
#
# Sem isto o grupo existe apenas como linha em /etc/group criada pelo
# scriptlet do RPM, que é o padrão de drift que o modelo bootc evita:
# /etc passa por merge 3-vias e uma vez modificado localmente deixa de
# receber atualizações da imagem.
#
# O GID fica dinâmico ('-') de propósito. Uma tentativa anterior de fixá-lo
# em 966 colidiu com o greetd, que recebeu esse mesmo número por alocação
# dinâmica ao ser instalado antes. Como socket, membros de grupo e
# permissões resolvem por nome em runtime, fixar o número traz colisão sem
# trazer benefício.
g docker -
