# O indexador do Nautilus não subia nesta sessão.
#
# A unit do localsearch trazia ConditionEnvironment=XDG_SESSION_CLASS=user, e o
# systemd a PULAVA: não é falha, é condição não satisfeita, e o único sinal é
# uma linha no journal. O sintoma visível era o Nautilus reclamando no stderr
# que não conseguiu ativar 'org.freedesktop.Tracker3.Miner.Files', e a busca
# por conteúdo simplesmente não funcionar.
#
# A condição não estava errada sobre esta máquina — a sessão É classe 'user'
# para o logind (Class=user, Service=greetd). Ela falha porque a variável não
# chega ao ambiente do systemd --user: com greetd + niri-session, o
# 'import-environment' traz XDG_SEAT, XDG_VTNR, XDG_SESSION_ID e as demais,
# mas XDG_SESSION_CLASS não é exportada.
#
# Aqui a lista de condições é zerada, e não substituída por outra. O propósito
# da condição no upstream é não indexar em sessão de greeter ou de background,
# e isso continua garantido por quem dispara a unit: o autostart da sessão
# gráfica e a ativação D-Bus do Nautilus. A conta do greeter não roda nenhum
# dos dois. Uma condição nova no lugar — XDG_CURRENT_DESKTOP=niri, por exemplo
# — voltaria a quebrar em silêncio no dia em que esse valor mudasse de forma.
[Unit]
ConditionEnvironment=
