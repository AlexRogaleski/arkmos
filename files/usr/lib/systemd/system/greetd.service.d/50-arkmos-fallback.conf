# Rede de segurança para a vt1.
#
# O greetd tem Conflicts=getty@tty1.service: assim que ele arranca, o getty da
# vt1 é parado. Se então o greetd falhar de vez (Restart=always esgota o
# StartLimitBurst e a unit termina em 'start-limit-hit'), ninguém volta a tomar
# a vt1 e a tela fica preta com o cursor — indistinguível de um travamento, e
# sem nenhum prompt local para diagnosticar o que aconteceu.
#
# Com isto, a falha do login gráfico degrada para um login de texto na mesma
# vt, de onde 'journalctl -u greetd' responde a pergunta.
#
# Aponta para uma unit própria, e não direto para getty@tty1.service, porque
# OnFailure dispara a CADA falha — não só na última. Durante o loop de
# reinício do greetd, o getty sobe e é morto junto, até esgotar o próprio
# limite de partidas e recusar o start. A unit intermediária existe para
# limpar esse estado antes de subir o getty; ver o comentário lá.
[Unit]
OnFailure=arkmos-login-fallback.service
