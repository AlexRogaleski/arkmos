# Só gera o CDI spec se a GPU NVIDIA estiver de fato no barramento.
#
# A unit vem da base ublue e condiciona a existir 'nvidia-smi' e 'nvidia-ctk',
# que existem sempre nesta imagem. Seu ExecStart é
#
#   nvidia-smi -L || /usr/sbin/nvidia-smi -L || /usr/lib/wsl/lib/nvidia-smi -L
#
# então, sem GPU, os dois primeiros falham e o terceiro nem existe: a unit
# morre com 127, reinicia 5 vezes e termina em 'failed'. Isso acontece em toda
# VM de teste e acontece nesta máquina sempre que a dGPU está desligada na
# BIOS — o Aurora instalado aqui carrega essa mesma falha em todo boot.
#
# O problema disso não é estético: um 'systemctl --failed' que nunca está
# vazio deixa de servir para achar a falha seguinte.
#
# 0x10de é o vendor id da NVIDIA no PCI. Com a dGPU desligada na BIOS ela não
# aparece no barramento, o ExecCondition sai com 1 e o systemd registra a unit
# como pulada em vez de falhada — é o mesmo mecanismo que a unit original já
# usa para testar o modules.dep, e ExecCondition é aditivo em drop-in.
#
# Condicionado ao hardware, e não a /dev/nvidiactl, de propósito: esse device
# pode ser criado sob demanda no primeiro uso do driver, e condicionar a ele
# arriscaria nunca gerar o CDI numa máquina que tem a GPU ligada.
[Service]
ExecCondition=/bin/sh -c 'grep -qx 0x10de /sys/bus/pci/devices/*/vendor'
