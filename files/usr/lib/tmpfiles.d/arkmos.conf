# Conteúdo em /var precisa de entradas tmpfiles.d: o bootc só popula /var na
# primeira instalação, então o que for assado aqui nunca mais é corrigido por
# uma atualização. Declarado assim, é reconciliado a cada boot.

# tuned recria seu conteúdo, mas os diretórios precisam existir.
d /var/lib/tuned 0755 root root -
d /var/log/tuned 0755 root root -

# O pacote greetd mascara o xdg-desktop-portal para a conta do greeter
# apontando a unit para /dev/null. Reproduzido aqui para que a máscara
# sobreviva a atualizações, e não só à instalação inicial.
d /var/lib/greetd/.config 0755 greetd greetd -
d /var/lib/greetd/.config/systemd 0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user 0755 greetd greetd -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null

# O tuigreet roda com --remember/--remember-user-session e grava o último
# usuário e a última sessão aqui. O diretório não vem no pacote e precisa
# pertencer à conta do greeter; sem ele as duas flags simplesmente não têm
# efeito, e o login volta ao campo vazio a cada boot.
d /var/cache/tuigreet 0755 greetd greetd -

# Noctalia Greeter.
#
# O tmpfiles.d que o upstream instala declara este diretório para o usuário
# 'greeter', que no Fedora não existe — a conta do greetd é 'greetd'. O arquivo
# dele é removido no build e a declaração correta é esta; ver o comentário no
# Containerfile.
d /var/lib/noctalia-greeter 0750 greetd greetd -

# 'C' copia só se o destino não existir, o que é o comportamento desejado para
# configuração em /var: a imagem entrega o padrão, e uma edição feita na
# máquina não é desfeita a cada boot nem a cada atualização.
C /var/lib/noctalia-greeter/greeter.toml 0640 greetd greetd - /usr/share/arkmos/noctalia-greeter.toml
