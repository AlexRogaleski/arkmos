# Arkmos — Flatpaks visíveis para a sessão inteira.
#
# O Fedora só acrescenta as pastas do Flatpak ao XDG_DATA_DIRS pelo
# /etc/profile.d/flatpak.sh, que roda em shell de login. O 'systemd --user',
# que é quem inicia a sessão gráfica, não passa por lá: o niri e tudo o que
# ele abre nascem com XDG_DATA_DIRS=/usr/local/share:/usr/share.
#
# A consequência não dá erro em lugar nenhum: o Nautilus não encontra
# aplicativo capaz de abrir o arquivo, e o clique duplo numa imagem, num PDF
# ou num vídeo simplesmente não faz nada — mesmo com o Flatpak instalado e
# declarado em /etc/xdg/mimeapps.list. Os ícones dos Flatpaks somem pelo mesmo
# motivo.
#
# A ordem segue a do flatpak.sh: instalação do usuário, instalação de sistema,
# e então os diretórios padrão. O profile.d continua valendo para os shells e
# não duplica o que já estiver aqui.
XDG_DATA_DIRS=${HOME}/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
