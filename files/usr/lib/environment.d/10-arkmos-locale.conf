# Localização para o gerenciador de sessão do usuário.
#
# Isto repete o /etc/locale.conf de propósito, porque são consumidores
# diferentes e um não alcança o outro:
#
#   /etc/locale.conf        systemd do SISTEMA, e shells de login (via
#                           /etc/profile.d/lang.sh)
#   environment.d           systemd --user, que é quem inicia os serviços da
#                           sessão e os autostarts XDG
#
# O 'systemd --user' é iniciado pelo pam_systemd no momento do login, antes de
# qualquer login shell rodar. Serviços que ele arranca — agente de autenticação,
# portais, daemons de sessão — nascem sem LANG, e aparecem em inglês no meio de
# um sistema em português. Foi o que aconteceu com o prompt de autenticação
# depois do login.
#
# Não é substituto do /etc/locale.conf: o console, o greeter e os serviços do
# sistema continuam lendo de lá.
LANG=pt_BR.UTF-8
