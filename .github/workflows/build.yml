name: build

# Todo push e pull request constrói as duas variantes e roda o
# tests/check-image.sh do 'just check'. Publicar é só no agendamento semanal
# (sábado 06:00 UTC, antes da atualização automática das 04:00 em Brasília)
# ou à mão, com a caixa 'publish' marcada — nunca num push. Ver PROJECT.md
# §28.2.
on:
  schedule:
    - cron: "0 6 * * 6"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar no GHCR (desmarcado: apenas construir e verificar)"
        type: boolean
        default: false

env:
  FEDORA_MAJOR: "44"

# Só push e pull request se cancelam: uma publicação interrompida entre o
# push e a assinatura deixaria no registry uma imagem sem assinatura.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  # O mesmo 'just lint' da máquina, em job próprio para responder em um minuto.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mesma versão do just da máquina: o formatador muda entre versões.
      - name: Instalar o just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.57.0

      # Ferramentas fixadas no Justfile, não as do runner (shellcheck 0.9.0).
      - name: just lint
        env:
          ARKMOS_LINT_CONTAINER: "1"
        run: just lint

  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    # Uma variante por job: as duas juntas não cabem no disco do runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          # A variante padrão publica sob o nome sem sufixo.
          - variant: base
            suffix: ""
            base_image: ghcr.io/ublue-os/base-main:44
            publishable: true

          # Publicar esta redistribui o driver NVIDIA: ver PROJECT.md §28.4.
          - variant: nvidia
            suffix: "-nvidia"
            base_image: ghcr.io/ublue-os/base-nvidia:44
            publishable: true

    env:
      # Avaliado no nível do job porque o 'if' de um passo não enxerga o
      # 'env' definido nesse mesmo passo.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_SECRET != '' }}
      IMAGE: arkmos${{ matrix.suffix }}

      # Agendamento semanal, ou manual com a caixa marcada.
      PUBLICAR: ${{ (github.event_name == 'schedule'
                     || (github.event_name == 'workflow_dispatch' && inputs.publish))
                    && matrix.publishable }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A imagem passa de 8 GB (11 GB a NVIDIA), mais do que o runner tem livre.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # Para a receita do rechunk. DEPOIS da limpeza, que apaga o
      # $AGENT_TOOLSDIRECTORY onde a action guarda o binário (PROJECT.md §28.2).
      - name: Instalar o just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.57.0

      # Falha em um segundo, e não no rechunk, nove minutos depois.
      - name: Conferir o just
        run: just --version

      - name: Gerar tags
        id: tags
        run: |
          # Esquema por data, como Fedora e ublue: 44.AAAAMMDD.N
          DATE="$(date -u +%Y%m%d)"
          BUILD="${GITHUB_RUN_NUMBER}"
          VERSION="${FEDORA_MAJOR}.${DATE}.${BUILD}"
          {
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

          # Minúsculo: o dono é "AlexRogaleski", e o podman recusa maiúsculas.
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Construir imagem
        run: |
          podman build \
            --build-arg BASE_IMAGE="${{ matrix.base_image }}" \
            --build-arg ARKMOS_VARIANT="${{ matrix.variant }}" \
            --build-arg ARKMOS_VERSION="${{ steps.tags.outputs.version }}" \
            --build-arg ARKMOS_COMMIT="${{ steps.tags.outputs.commit }}" \
            --build-arg ARKMOS_REGISTRY="${IMAGE_REGISTRY}" \
            --tag "${IMAGE}:${{ steps.tags.outputs.version }}" \
            --tag "${IMAGE}:${FEDORA_MAJOR}" \
            --tag "${IMAGE}:latest" \
            .

      # Camadas por conteúdo, para o 'bootc upgrade' baixar só o que mudou.
      # Antes da verificação, que examina a imagem que vai ao registry. O plano
      # anterior só é herdado se a publicada já é reorganizada, e quem diz isso
      # é a contagem de camadas, não o label ostree.final-diffid, que vem da
      # base. Ver PROJECT.md §28.5.
      - name: Reorganizar camadas (rechunk)
        run: |
          anterior=""
          publicada="docker://${IMAGE_REGISTRY}/${IMAGE}:${FEDORA_MAJOR}"
          camadas="$(skopeo inspect --raw "$publicada" 2>/dev/null \
              | jq '.layers | length' || true)"
          if [ "${camadas:-0}" -gt 0 ] && [ "${camadas}" -le 128 ]; then
              anterior="$publicada"
              echo "plano de camadas herdado de ${anterior} (${camadas} camadas)"
          else
              echo "publicação anterior não é reorganizada (${camadas:-0} camadas); plano novo"
          fi

          just ostree-rechunk "${IMAGE}:latest" "${anterior}"

          # O rechunk grava só na tag que recebeu; as outras duas voltam a
          # apontar para a imagem reorganizada.
          podman tag "${IMAGE}:latest" \
            "${IMAGE}:${{ steps.tags.outputs.version }}" \
            "${IMAGE}:${FEDORA_MAJOR}"

      # O mesmo script do 'just check'.
      - name: Verificar imagem
        run: ./tests/check-image.sh "${IMAGE}:latest"

      - name: Login no GHCR
        if: env.PUBLICAR == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar
        if: env.PUBLICAR == 'true'
        id: push
        run: |
          # Assina-se o digest publicado (--digestfile), não o local: o push
          # recomprime as camadas. Tags com digests diferentes param aqui.
          for tag in "${{ steps.tags.outputs.version }}" "${FEDORA_MAJOR}" latest; do
            podman push --digestfile "${RUNNER_TEMP}/digest-${tag}" \
              "${IMAGE}:${tag}" "docker://${IMAGE_REGISTRY}/${IMAGE}:${tag}"
          done
          DIGEST="$(cat "${RUNNER_TEMP}/digest-latest")"
          for tag in "${{ steps.tags.outputs.version }}" "${FEDORA_MAJOR}"; do
            [ "$(cat "${RUNNER_TEMP}/digest-${tag}")" = "${DIGEST}" ] \
              || { echo "::error::a tag ${tag} foi publicada com outro digest"; exit 1; }
          done
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Instalar cosign
        if: env.PUBLICAR == 'true' && env.HAS_SIGNING_KEY == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Ver PROJECT.md §28.3.
      - name: Assinar
        if: env.PUBLICAR == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          # Sem ela o cosign pede a senha e trava o job; vazia serve.
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # O cosign não lê o login do podman: sem isto, UNAUTHORIZED.
          echo "${GH_TOKEN}" \
            | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Formato clássico (tag sha256-<digest>.sig), o único que o podman e
          # o bootc leem; as duas opções vêm ligadas no cosign 3 (§28.2).
          cosign sign --yes --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE}@${DIGEST}"

      # Com a mesma chave que vai na imagem, como o 'bootc upgrade' fará.
      - name: Verificar a assinatura publicada
        if: env.PUBLICAR == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # O verify também espera o formato novo por padrão.
          cosign verify --new-bundle-format=false \
            --key files/etc/pki/containers/arkmos.pub \
            "${IMAGE_REGISTRY}/${IMAGE}@${DIGEST}"

      # --- Retenção (PROJECT.md §28.2) ------------------------------------

      # Versões que ficaram sem tag quando 44 e latest foram movidas.
      - name: Remover versões sem tag
        if: env.PUBLICAR == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ env.IMAGE }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0

      # 12 versões = ~6 publicações: imagem e assinatura contam uma cada.
      - name: Manter apenas as últimas versões
        if: env.PUBLICAR == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ env.IMAGE }}
          package-type: container
          min-versions-to-keep: 12
