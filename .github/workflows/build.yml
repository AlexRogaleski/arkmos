name: build

# Duas funções distintas, e elas entram em momentos diferentes do projeto.
#
# VERIFICAR vale agora: cada push constrói as duas variantes e roda o mesmo
# tests/check-image.sh do 'just check'. É o que pega regressão enquanto o
# projeto muda rápido, sem depender de alguém lembrar de rodar a verificação
# na máquina.
#
# PUBLICAR só vale quando houver máquina instalada para atualizar — é a peça
# que transforma o Arkmos de "reconstruir e reinstalar" em um sistema
# atualizável por 'bootc upgrade'. Até lá publicar é encher o registry de
# versões que ninguém baixa, então fica atrás de um acionamento manual.
#
# Sem 'schedule' por enquanto: o cron existe para acompanhar a reconstrução
# diária da base do Universal Blue, e isso só protege uma imagem que está em
# uso. Ligar quando a publicação virar rotina.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar no GHCR (desmarcado: apenas construir e verificar)"
        type: boolean
        default: false

env:
  FEDORA_MAJOR: "44"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # shellcheck nos scripts, actionlint neste arquivo e a sintaxe do Justfile,
  # pelas mesmas receitas que rodam na máquina ('just lint'). Job separado, e
  # não um passo do build: dá retorno em menos de um minuto e não segura a
  # publicação, que leva vinte.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A mesma action que o image-template do Universal Blue usa, fixada por
      # commit e não por tag.
      #
      # A versão do just é fixada na mesma que roda na máquina: o formatador
      # dele muda de uma versão para outra, e o 'just --fmt --check' passava
      # aqui e falhava no CI, que instalava a mais recente.
      - name: Instalar o just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.57.0

      # ARKMOS_LINT_CONTAINER força as ferramentas fixadas no Justfile em vez
      # das do runner, que traz shellcheck 0.9.0 contra a 0.11.0 que usamos.
      - name: just lint
        env:
          ARKMOS_LINT_CONTAINER: "1"
        run: just lint

  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    # Uma variante por job, não as duas num job só: o runner do GitHub já
    # precisa de limpeza para caber UMA imagem de ~11 GB, e as duas juntas
    # estouram o disco. Em jobs separados elas também constroem em paralelo.
    strategy:
      fail-fast: false
      matrix:
        include:
          # A variante padrão publica sob o nome sem sufixo.
          - variant: base
            suffix: ""
            base_image: ghcr.io/ublue-os/base-main:44
            publishable: true

          # A variante NVIDIA também publica, desde que o ciclo de publicar
          # e atualizar foi validado na padrão (seção 35.2). São ~5 GB por
          # versão, e em repositório público não há cota de registry.
          #
          # Publicar esta variante redistribui o driver NVIDIA, que é
          # proprietário — a licença dele permite, e as condições que ela
          # impõe são cumpridas aqui. Ver PROJECT.md 28.4.
          #
          # Ela compartilha a árvore files/ inteira com a padrão: o que pode
          # quebrar só nela é algo vindo da base — a imagem sair do ar, mudar
          # de nome, deixar de trazer um pacote.
          - variant: nvidia
            suffix: "-nvidia"
            base_image: ghcr.io/ublue-os/base-nvidia:44
            publishable: true

    env:
      # Avaliado no nível do job porque o 'if' de um passo não enxerga o
      # 'env' definido nesse mesmo passo.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_SECRET != '' }}
      IMAGE: arkmos${{ matrix.suffix }}

      # Publica só quando o acionamento é manual E a caixa foi marcada E esta
      # variante é publicável. Em push e em pull request o job constrói e
      # verifica, e para aí.
      PUBLICAR: ${{ github.event_name == 'workflow_dispatch'
                    && inputs.publish
                    && matrix.publishable }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O runner do GitHub vem com pouco espaço livre: a variante padrão passa
      # de 8 GB por causa dos codecs que vêm da base, e a NVIDIA de 11 GB.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Gerar tags
        id: tags
        run: |
          # Esquema por data, como Fedora e ublue: 44.AAAAMMDD.N
          # O número da versão não é a rede de segurança — 'bootc rollback' é.
          DATE="$(date -u +%Y%m%d)"
          BUILD="${GITHUB_RUN_NUMBER}"
          VERSION="${FEDORA_MAJOR}.${DATE}.${BUILD}"
          {
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

          # O nome do repositório no registry tem de ser minúsculo, e o dono
          # desta conta é "AlexRogaleski". github.repository_owner vem com as
          # maiúsculas e as expressões do Actions não têm lower(): montado
          # direto, o podman recusa o nome ("repository name must be
          # lowercase") e a publicação quebra no push.
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Construir imagem
        run: |
          podman build \
            --build-arg BASE_IMAGE="${{ matrix.base_image }}" \
            --build-arg ARKMOS_VARIANT="${{ matrix.variant }}" \
            --build-arg ARKMOS_VERSION="${{ steps.tags.outputs.version }}" \
            --build-arg ARKMOS_COMMIT="${{ steps.tags.outputs.commit }}" \
            --build-arg ARKMOS_REGISTRY="${IMAGE_REGISTRY}" \
            --tag "${IMAGE}:${{ steps.tags.outputs.version }}" \
            --tag "${IMAGE}:${FEDORA_MAJOR}" \
            --tag "${IMAGE}:latest" \
            .

      # Rechunk: reorganiza as camadas por conteúdo antes de verificar e
      # publicar. É o passo que Bluefin, Aurora e Bazzite dão, e que o
      # image-template do Universal Blue traz como 'ostree-rechunk'.
      #
      # Medido nesta imagem: 289 camadas e 9,88 GB viraram 128 camadas e
      # 8,02 GB, porque o rpm-ostree unifica os objetos duplicados. O ganho
      # maior é no 'bootc upgrade' de quem usa: camadas decididas por conteúdo
      # são estáveis entre publicações, então o download passa a ser só do que
      # mudou. O custo é o tempo deste passo, uns doze minutos.
      #
      # A verificação vem DEPOIS, de propósito: o que o just check examina é
      # exatamente a imagem que vai ao registry.
      #
      # O --previous-build mantém o plano de camadas da publicação anterior, e
      # só entra quando a imagem publicada já é chunked — o label
      # 'ostree.final-diffid' é o que diz isso. Na primeira publicação com
      # rechunk ele não existe ainda.
      - name: Reorganizar camadas (rechunk)
        run: |
          anterior=""
          if skopeo inspect "docker://${IMAGE}:${FEDORA_MAJOR}" 2>/dev/null \
              | jq -e '.Labels["ostree.final-diffid"]' >/dev/null; then
              anterior="docker://${IMAGE}:${FEDORA_MAJOR}"
              echo "plano de camadas herdado de ${anterior}"
          else
              echo "publicação anterior não é chunked; plano novo"
          fi

          just ostree-rechunk "${IMAGE}:latest" "${anterior}"

          # O rechunk grava só na tag que recebeu; as outras duas voltam a
          # apontar para a imagem reorganizada.
          podman tag "${IMAGE}:latest" \
            "${IMAGE}:${{ steps.tags.outputs.version }}" \
            "${IMAGE}:${FEDORA_MAJOR}"

      # Mesmo script que o 'just check' local roda. O lint já roda como
      # última camada do Containerfile; o script o repete para que a falha
      # apareça como passo próprio no log do CI.
      - name: Verificar imagem
        run: ./tests/check-image.sh "${IMAGE}:latest"

      - name: Login no GHCR
        if: env.PUBLICAR == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar
        if: env.PUBLICAR == 'true'
        id: push
        run: |
          # O digest a assinar é o que o registry recebeu, não o da imagem
          # local. O push recomprime as camadas e o manifesto publicado ganha
          # outro digest, e o 'podman inspect' continua mostrando o local
          # mesmo depois do push: assinar esse seria assinar algo que não
          # existe no registry. O --digestfile devolve o publicado.
          #
          # Cada tag é um push próprio. Se os digests divergirem, a assinatura
          # cobriria só uma das tags — então a publicação para aqui.
          for tag in "${{ steps.tags.outputs.version }}" "${FEDORA_MAJOR}" latest; do
            podman push --digestfile "${RUNNER_TEMP}/digest-${tag}" \
              "${IMAGE}:${tag}" "docker://${IMAGE_REGISTRY}/${IMAGE}:${tag}"
          done
          DIGEST="$(cat "${RUNNER_TEMP}/digest-latest")"
          for tag in "${{ steps.tags.outputs.version }}" "${FEDORA_MAJOR}"; do
            [ "$(cat "${RUNNER_TEMP}/digest-${tag}")" = "${DIGEST}" ] \
              || { echo "::error::a tag ${tag} foi publicada com outro digest"; exit 1; }
          done
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Instalar cosign
        if: env.PUBLICAR == 'true' && env.HAS_SIGNING_KEY == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A política de assinatura da imagem (/etc/containers/policy.json) só
      # passa a valer depois que a chave pública correspondente estiver em
      # /etc/pki/containers/arkmos.pub. Ver README.
      - name: Assinar
        if: env.PUBLICAR == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          # Sem esta variável o cosign tenta PEDIR a senha da chave, e num
          # runner sem terminal isso trava o job até o timeout. Vazia quando o
          # secret não existe, que é o caso de uma chave gerada sem senha.
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # O cosign precisa do próprio login: ele não lê o arquivo de
          # autenticação do podman, e sim a configuração do Docker. Sem isto
          # ele tenta anônimo e o GHCR responde UNAUTHORIZED — foi o que
          # quebrou a primeira publicação, já depois de o push ter dado certo.
          echo "${GH_TOKEN}" \
            | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

          # --new-bundle-format=false não é detalhe: no cosign 3 essa opção
          # vem LIGADA, e a assinatura vira um bundle Sigstore anexado pela
          # API de referrers. O GHCR não suporta essa API, então o cosign cai
          # numa tag de índice 'sha256-<digest>' — e o podman e o bootc não
          # procuram ali. Eles leem a sigstore attachment clássica, a tag
          # 'sha256-<digest>.sig', que no formato novo nem existe: o resultado
          # é uma imagem que o cosign valida e a máquina recusa no upgrade.
          # --use-signing-config=false acompanha: no cosign 3 ela vem LIGADA e
          # exige o formato novo, então sozinha a opção acima é recusada antes
          # de assinar ("must provide --new-bundle-format ... with
          # --use-signing-config"). As duas juntas voltam ao fluxo clássico.
          cosign sign --yes --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE}@${DIGEST}"

      # A assinatura é o que a máquina instalada vai exigir para atualizar.
      # Conferir aqui, com a mesma chave pública que vai dentro da imagem, é
      # mais barato do que descobrir no 'bootc upgrade' que ela não confere.
      - name: Verificar a assinatura publicada
        if: env.PUBLICAR == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # A mesma opção aqui, e pelo mesmo motivo: o verify também espera o
          # bundle por padrão. Sem ela, esta verificação passaria a cobrar o
          # formato que a máquina não usa.
          cosign verify --new-bundle-format=false \
            --key files/etc/pki/containers/arkmos.pub \
            "${IMAGE_REGISTRY}/${IMAGE}@${DIGEST}"

      # --- Retenção -------------------------------------------------------
      #
      # Cada publicação cria UMA versão (um digest) carregando três tags:
      # 44.AAAAMMDD.N, 44 e latest. Nada remove as anteriores, e cada uma
      # ocupa ~4 GB. Em repositório público isso não custa cota, mas uma
      # listagem de pacote com centenas de versões deixa de ser navegável — e
      # no dia em que o schedule for ligado, passa a crescer sozinha.
      #
      # Dois passos, porque as duas limpezas têm critérios diferentes.

      # Mover as tags 44 e latest para a versão nova deixa a anterior sem
      # nenhuma tag apontando para ela. Essas não servem para nada: não dá
      # para referenciá-las por nome, e não são alvo de rollback.
      - name: Remover versões sem tag
        if: env.PUBLICAR == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ env.IMAGE }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0

      # Histórico de imagem para reinstalar do zero uma versão que se sabe
      # boa, quando a mais recente não presta. O rollback do dia a dia é
      # outra coisa, e é local: 'bootc rollback' usa o deployment anterior,
      # que já está no disco e não depende do registry.
      #
      # A conta não é uma versão por publicação: cada publicação cria DUAS
      # versões no GHCR, a imagem e a assinatura do cosign, que é um artefato
      # próprio. Então 12 versões são cerca de 6 publicações. Com o valor
      # anterior (5) sobravam duas, e durante os testes da 0.8.0 as versões
      # usadas como teste negativo foram apagadas no meio do caminho.
      - name: Manter apenas as últimas versões
        if: env.PUBLICAR == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ env.IMAGE }}
          package-type: container
          min-versions-to-keep: 12
