name: build

# Sem isto o 'bootc upgrade' não existe: a máquina precisa resolver a imagem
# a partir de um registry. Esta é a peça que transforma o Arkmos de
# "reconstruir e reinstalar" em um sistema operacional atualizável.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A base ublue é reconstruída diariamente; seguir de perto evita ficar
    # para trás em correção de segurança do kernel e do driver.
    - cron: "30 6 * * *"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  FEDORA_MAJOR: "44"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    # Uma variante por job, não as duas num job só: o runner do GitHub já
    # precisa de limpeza para caber UMA imagem de ~11 GB, e as duas juntas
    # estouram o disco. Em jobs separados elas também constroem em paralelo.
    strategy:
      fail-fast: false
      matrix:
        include:
          # A variante padrão publica sob o nome sem sufixo.
          - variant: base
            suffix: ""
            base_image: ghcr.io/ublue-os/base-main:44
          - variant: nvidia
            suffix: "-nvidia"
            base_image: ghcr.io/ublue-os/base-nvidia:44

    env:
      # Avaliado no nível do job porque o 'if' de um passo não enxerga o
      # 'env' definido nesse mesmo passo.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_SECRET != '' }}
      IMAGE: arkmos${{ matrix.suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O runner do GitHub vem com pouco espaço livre: a variante padrão passa
      # de 8 GB por causa dos codecs que vêm da base, e a NVIDIA de 11 GB.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Gerar tags
        id: tags
        run: |
          # Esquema por data, como Fedora e ublue: 44.AAAAMMDD.N
          # O número da versão não é a rede de segurança — 'bootc rollback' é.
          DATE="$(date -u +%Y%m%d)"
          BUILD="${GITHUB_RUN_NUMBER}"
          VERSION="${FEDORA_MAJOR}.${DATE}.${BUILD}"
          {
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Construir imagem
        run: |
          podman build \
            --build-arg BASE_IMAGE="${{ matrix.base_image }}" \
            --build-arg ARKMOS_VARIANT="${{ matrix.variant }}" \
            --build-arg ARKMOS_VERSION="${{ steps.tags.outputs.version }}" \
            --build-arg ARKMOS_COMMIT="${{ steps.tags.outputs.commit }}" \
            --tag "${IMAGE}:${{ steps.tags.outputs.version }}" \
            --tag "${IMAGE}:${FEDORA_MAJOR}" \
            --tag "${IMAGE}:latest" \
            .

      # Mesmo script que o 'just check' local roda. O lint já roda como
      # última camada do Containerfile; o script o repete para que a falha
      # apareça como passo próprio no log do CI.
      - name: Verificar imagem
        run: ./tests/check-image.sh "${IMAGE}:latest"

      # Pull request nunca publica: valida e para por aqui.
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publicar
        if: github.event_name != 'pull_request'
        id: push
        run: |
          for tag in "${{ steps.tags.outputs.version }}" "${FEDORA_MAJOR}" latest; do
            podman push "${IMAGE}:${tag}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE}:${tag}"
          done
          DIGEST="$(podman inspect --format '{{index .RepoDigests 0}}' \
            "${IMAGE}:latest" | cut -d@ -f2)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Instalar cosign
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A política de assinatura da imagem (/etc/containers/policy.json) só
      # passa a valer depois que a chave pública correspondente estiver em
      # /usr/lib/pki/containers/arkmos.pub. Ver README.
      - name: Assinar
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE}@${DIGEST}"
