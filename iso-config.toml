# Configuração do bootc-image-builder para a MÍDIA DE INSTALAÇÃO (just iso).
# A de teste, com console serial e sshd, é o config.toml.
#
# O kickstart é declarado por inteiro, e o motivo de cada linha está no
# PROJECT.md §31 ("O kickstart é nosso"). O essencial para quem for editar:
#
#   - sem clearpart/zerombr: com eles a mídia apaga o primeiro disco que
#     encontrar, sem perguntar. Sem eles, o Anaconda para na tela de disco.
#   - o builder inclui um osbuild-base.ks com um %post próprio, e o 'bootc
#     switch' deste arquivo tem de ser o último, porque é ele que exige a
#     assinatura. A receita 'iso' confere isso na ISO pronta.
#   - @IMAGEM@ é trocado pela receita 'iso' pela imagem instalada (padrão ou
#     NVIDIA).
#
# O %post devolve o /etc que o módulo de localização reescreve (§35.2.2) e leva
# a compressão do fstab para o rootflags (§6).
#
# O módulo de localização vem desligado no anaconda-iso do builder, e sem ele o
# instalador ignora 'lang' e 'keyboard' e abre em inglês, com teclado us.
[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Localization"]

[customizations.installer.kickstart]
contents = """
rootpw --lock
lang pt_BR.UTF-8
keyboard br
timezone America/Sao_Paulo --utc
autopart --nohome --type=btrfs
network --device=link --bootproto=dhcp --onboot=on --activate
%post --erroronfail
set -e
cp -a /usr/etc/locale.conf /etc/locale.conf
cp -a /usr/etc/vconsole.conf /etc/vconsole.conf
rm -f /etc/X11/xorg.conf.d/00-keyboard.conf
[ -d /usr/etc/X11/xorg.conf.d ] || rmdir --ignore-fail-on-non-empty /etc/X11/xorg.conf.d 2>/dev/null || true
sed -i '\\|^[^#[:space:]]*[[:space:]]\\+/[[:space:]]\\+btrfs[[:space:]]|d' /etc/fstab
ls /boot/loader/entries/*.conf >/dev/null
for entrada in /boot/loader/entries/*.conf; do
    grep -q '^options .*rootflags=' "$entrada"
    grep -q '^options .*compress=' "$entrada" ||
        sed -i '/^options / s/\\(rootflags=[^ ]*\\)/\\1,compress=zstd:1/' "$entrada"
done
bootc switch --mutate-in-place --transport registry \
    --enforce-container-sigpolicy @IMAGEM@
%end
reboot --eject
"""
